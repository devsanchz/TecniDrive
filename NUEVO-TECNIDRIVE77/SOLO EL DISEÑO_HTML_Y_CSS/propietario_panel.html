<!----------------------------------------------------PERFIL DEL USUARIO------------------------------------------------------------------------------------------------------------------->

  


  <!-- EL LUGAR DEL USUARIO CARTA -->
  <section class="profile-card" id="profileCard">
      <!-- LUGAR DE NOTIFICACIONES -->
       <a class="notis" href="pt_notificaciones.html"><div class="notificaciones">
       <i class="bi bi-bell-fill campana"></i>
        <small  class="noti">2</small>
       </div>
        </a> 

        <!-- AVATER PERFIL -->
        <div class="profile-avatar" id="profileAvatar">
            <i class="bi bi-person-check" id="profileIcon"></i>
        </div>

        <!-- EDITAR COLOR -->
        <div class="color-editor" id="colorEditor">
           <label for="avatarColor">
                Editar color <br>
            <input type="color" id="avatarColor" value="#3f4bd0">
         </label>
        </div>

        <!-- INFORMACION PERFIL -->
        <ul class="profile-info">

            <!-- NOMBRE -->
            <li>
                <span id="userName">
                    Jaime Pineda Uribe
                </span>
            </li>

            <!-- ROL -->
            <li>
                <span id="userRole">
                   Propietario
                </span>
            </li>

            <!-- CORREO -->
            <li class="email-container">
                <i class="bi bi-envelope-at-fill email-icon"></i>
                <span id="userEmail">
                    marianatapia262@gmail.com
                </span>

                <!-- INPUT PARA EDITAR -->
                <input type="email"
                       id="emailInput"
                       value="marianatapia262@gmail.com">
            </li>
        </ul>
       
         <!-- TELEFONO -->
            <li class="telefono-container">
                <i class="bi bi-telephone-plus-fill telefono-icon"></i>
                <span id="usertelefono">
                   3224509192
                </span>

                <!-- INPUT PARA EDITAR telefno -->
                <input type="tel"
                       id="telefonoInput"
                       value="  3224509192">
            </li>
        </ul>

        <!-- BOTON EDITAR PERFIL -->
        <div class="profile-buttons">

            <button id="editButton">
            Editar perfil
            </button>

        <!-- BOTON LISTO -->
            <button id="saveButton">
                Listo
            </button>

        </div>
    </section>
</div>

</html>
<script>

document.addEventListener("DOMContentLoaded", () => {

   // =====================================================
   //PARTE DE LAS NOTIFIACIONES
    // =====================================================

    // =====================================================
    // ELEMENTOS HTML
    // =====================================================

    const profileCard = document.getElementById("profileCard");

    const editButton = document.getElementById("editButton");
    const saveButton = document.getElementById("saveButton");

    // EMAIL
    const userEmail = document.getElementById("userEmail");
    const emailInput = document.getElementById("emailInput");

    // TELEFONO
    const usertelefono = document.getElementById("usertelefono");
    const telefonoInput = document.getElementById("telefonoInput");

    // COLOR AVATAR
    const colorEditor = document.getElementById("colorEditor");
    const avatarColor = document.getElementById("avatarColor");

    const profileAvatar = document.getElementById("profileAvatar");
    const profileIcon = document.getElementById("profileIcon");

    const userRole = document.getElementById("userRole");

    // =====================================================
    // EVENTOS
    // =====================================================

    setRoleColor();

    editButton.addEventListener("click", enableEditMode);

    saveButton.addEventListener("click", saveProfileChanges);

    if(avatarColor){
        avatarColor.addEventListener("input", updateAvatarColor);
    }

    // =====================================================
    // FUNCION: ACTIVAR EDICION
    // =====================================================

    function enableEditMode(){

        // FONDO GRIS
        profileCard.classList.add("editing");

        // EMAIL
        userEmail.style.display = "none";
        emailInput.style.display = "inline-block";

        // TELEFONO
        usertelefono.style.display = "none";
        telefonoInput.style.display = "inline-block";

        // COLOR
        if(colorEditor){
            colorEditor.style.display = "block";
        }

        // BOTONES
        editButton.style.display = "none";
        saveButton.style.display = "inline-block";
    }

    // =====================================================
    // FUNCION: GUARDAR
    // =====================================================

    function saveProfileChanges(){

        // ACTUALIZAR EMAIL
        userEmail.textContent = emailInput.value;

        // ACTUALIZAR TELEFONO
        usertelefono.textContent = telefonoInput.value;

        // MOSTRAR TEXTO
        userEmail.style.display = "inline";
        usertelefono.style.display = "inline";

        // OCULTAR INPUTS
        emailInput.style.display = "none";
        telefonoInput.style.display = "none";

        // OCULTAR COLOR
        if(colorEditor){
            colorEditor.style.display = "none";
        }

        // QUITAR FONDO
        profileCard.classList.remove("editing");

        // BOTONES
        saveButton.style.display = "none";
        editButton.style.display = "inline-block";
    }

    // =====================================================
    // FUNCION: CAMBIAR COLOR
    // =====================================================

    function updateAvatarColor(){

        const selectedColor = avatarColor.value;

        if(profileAvatar){
            profileAvatar.style.borderColor = selectedColor;
        }

        if(profileIcon){
            profileIcon.style.color = selectedColor;
        }
    }

    // =====================================================
    // FUNCION: COLOR ROL
    // =====================================================

    function setRoleColor(){

        if(!userRole) return;

        const roleText = userRole.textContent.toLowerCase();

        if(roleText.includes("administrador")){
            userRole.classList.add("administrador");
        }

        else if(roleText.includes("propietario")){
            userRole.classList.add("propietario");
        }

        else if(roleText.includes("mecanico")){
            userRole.classList.add("mecanico");
        }
    }

});


</script>
